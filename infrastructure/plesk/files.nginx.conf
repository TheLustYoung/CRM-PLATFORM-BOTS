# Neutral public domain: download links, the payment page and payment-provider webhooks — nothing else.
# If API_PORT in .env is not the default, use that port in proxy_pass below (the Plesk server uses 18000).
location ^~ /f/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
    add_header Referrer-Policy no-referrer always;
    access_log off;
}
location ^~ /pay/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    add_header Referrer-Policy no-referrer always;
}
location ^~ /go/ {  # sponsored-message buttons: click counting, then the advertiser's page
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    add_header Referrer-Policy no-referrer always;
}
location ^~ /webhooks/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    client_max_body_size 1m;
}
location / { return 404; }
