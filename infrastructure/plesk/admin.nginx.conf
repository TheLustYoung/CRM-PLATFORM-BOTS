# If DASHBOARD_PORT in .env is not the default, use that port in proxy_pass below.
# HTTPS vhost: replace default root location or use Plesk Docker Proxy Rules, not both.
client_max_body_size 12m;  # bot profile photo upload
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}
