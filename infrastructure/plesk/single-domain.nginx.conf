# Everything on one domain: admin panel at / and public file links at /f/.
# Plesk: Apache & nginx Settings -> untick "Proxy mode" -> paste into "Additional nginx directives".
# __API_PORT__ / __DASHBOARD_PORT__ are the API_PORT / DASHBOARD_PORT values from .env
# (server-setup.sh prints this file with the real ports filled in).

# The project folder may live inside httpdocs: never serve it.
location ^~ /telegram-media/ { return 404; }
location ^~ /internal/ { return 404; }

location ^~ /f/ {
    proxy_pass http://127.0.0.1:__API_PORT__;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
    add_header Referrer-Policy no-referrer always;
}

# Card/crypto payment page, payment providers' webhooks and sponsored-message links go to the API too.
location ~ ^/(pay|webhooks|go)/ {
    proxy_pass http://127.0.0.1:__API_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    add_header Referrer-Policy no-referrer always;
}

# Regex form: a plain "location /" can clash with Plesk's own one ("duplicate location").
location ~ ^/ {
    client_max_body_size 12m;  # bot profile photo upload
    proxy_pass http://127.0.0.1:__DASHBOARD_PORT__;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}
